<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro - 설정</title>
    <link rel="stylesheet" href="setting.css" />
  </head>
  <body>
    <div class="container">
      <h3>Setting</h3>

      <div class="field">
        <label for="timerMinutes">타이머 시간 (분)</label>

      </div>

      <button class="btn btn-save" onclick="saveSettings()">설정 완료</button>
    </div>
    <script src="setting.js"></script>
  </body>
</html>
