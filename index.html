<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <h1>Pomodoro</h1>

      <div class="timer">25:00</div>

      <div class="controls">
        <button class="btn btn-start" onclick="start()">시작</button>
        <button class="btn btn-stop" onclick="stop()">정지</button>
        <button class="btn btn-reset" onclick="reset()">초기화</button>
      </div>

      <a href="settings.html" class="btn btn-settings">설정</a>
    </div>
    <script src="index.js"></script>
  </body>
</html>
